global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "givin-c4i-cluster"
    metrics_path: "/api/system/metrics"
    static_configs:
      - targets: ["givin-api-service.givin-system.svc.cluster.local:8000"]
        labels:
          environment: "production"
          region: "gujarat-central"
          datacenter: "gsdc-gandhinagar"

  - job_name: "givin-local-dev"
    metrics_path: "/api/system/metrics"
    static_configs:
      - targets: ["127.0.0.1:8000", "localhost:8000"]
        labels:
          environment: "development"
