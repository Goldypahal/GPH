# /etc/strongswan.conf - strongSwan system configuration for GSWAN Gateway

charon {
    load_modular = yes
    plugins {
        include strongswan.d/charon/*.conf
    }
    # Enforce MSS clamping to 1360 bytes to prevent MTU fragmentation over IPsec WAN
    install_routes = yes
    install_virtual_ip = yes
}

include strongswan.d/*.conf
