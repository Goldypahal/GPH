# ==============================================================================
# GIVIN PostgreSQL 16 + PostGIS 3.4 High-Availability Cluster with Patroni HA
# Architecture:
#   - 3-node Patroni HA Cluster (1 Primary + 2 Synchronous Replicas)
#   - 3-node etcd Distributed Consensus Store (DCS) for automated failover & leader election
#   - Separate Services for Primary (Read-Write) and Read-Only Replicas
#   - Continuous WAL Archiving & Point-In-Time Recovery (PITR) support
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  namespace: givin-system
  labels:
    app: etcd
    app.kubernetes.io/part-of: givin-platform
spec:
  ports:
    - port: 2379
      name: client
    - port: 2380
      name: peer
  clusterIP: None
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: givin-system
  labels:
    app: etcd
    app.kubernetes.io/part-of: givin-platform
spec:
  serviceName: etcd-headless
  replicas: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.11
          command:
            - /usr/local/bin/etcd
            - --name=$(HOSTNAME)
            - --initial-advertise-peer-urls=http://$(HOSTNAME).etcd-headless.givin-system.svc.cluster.local:2380
            - --listen-peer-urls=http://0.0.0.0:2380
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(HOSTNAME).etcd-headless.givin-system.svc.cluster.local:2379
            - --initial-cluster-token=etcd-cluster-givin
            - --initial-cluster=etcd-0=http://etcd-0.etcd-headless.givin-system.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd-headless.givin-system.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd-headless.givin-system.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --data-dir=/var/run/etcd/default.etcd
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          volumeMounts:
            - name: etcd-data
              mountPath: /var/run/etcd
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp3-nvme"
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
  namespace: givin-system
data:
  patroni.yml: |
    scope: givin-postgis-cluster
    namespace: /service
    name: ${HOSTNAME}

    etcd3:
      hosts:
        - etcd-0.etcd-headless.givin-system.svc.cluster.local:2379
        - etcd-1.etcd-headless.givin-system.svc.cluster.local:2379
        - etcd-2.etcd-headless.givin-system.svc.cluster.local:2379

    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${HOSTNAME}.postgres-patroni-headless.givin-system.svc.cluster.local:8008

    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        synchronous_mode: true
        synchronous_node_count: 1
        postgresql:
          use_pg_rewind: true
          parameters:
            max_connections: 500
            shared_buffers: 4GB
            effective_cache_size: 12GB
            work_mem: 64MB
            maintenance_work_mem: 512MB
            wal_level: replica
            max_wal_senders: 10
            max_replication_slots: 10
            hot_standby: "on"
            archive_mode: "on"
            archive_command: "test ! -f /var/backups/wal/%f && cp %p /var/backups/wal/%f"
            checkpoint_completion_target: 0.9
            wal_buffers: 16MB
            default_statistics_target: 100

      initdb:
        - encoding: UTF8
        - data-checksums

      pg_hba:
        - host replication replicator 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5

    postgresql:
      listen: 0.0.0.0:5432
      connect_address: ${HOSTNAME}.postgres-patroni-headless.givin-system.svc.cluster.local:5432
      data_dir: /var/lib/postgresql/data/patroni
      bin_dir: /usr/lib/postgresql/16/bin
      authentication:
        replication:
          username: replicator
          password: ${PATRONI_REPLICATION_PASSWORD}
        superuser:
          username: postgres
          password: ${POSTGRES_PASSWORD}
---
# Primary Service: Routes traffic to the current elected Patroni Primary (Read-Write)
apiVersion: v1
kind: Service
metadata:
  name: postgres-patroni
  namespace: givin-system
  labels:
    app: postgres-patroni
    role: primary
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-patroni
    role: master
---
# Read-Only Replica Service: Routes load-balanced analytical/reporting queries across replicas
apiVersion: v1
kind: Service
metadata:
  name: postgres-patroni-ro
  namespace: givin-system
  labels:
    app: postgres-patroni
    role: replica
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-patroni
    role: replica
---
# Headless Service for Patroni peer communication
apiVersion: v1
kind: Service
metadata:
  name: postgres-patroni-headless
  namespace: givin-system
spec:
  ports:
    - port: 5432
      name: postgres
    - port: 8008
      name: patroni-api
  clusterIP: None
  selector:
    app: postgres-patroni
---
# Patroni HA 3-Node StatefulSet with PostGIS 16
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-patroni
  namespace: givin-system
spec:
  serviceName: postgres-patroni-headless
  replicas: 3
  selector:
    matchLabels:
      app: postgres-patroni
  template:
    metadata:
      labels:
        app: postgres-patroni
    spec:
      containers:
        - name: patroni-postgis
          image: postgis/postgis:16-3.4
          command: ["patroni", "/etc/patroni/patroni.yml"]
          ports:
            - containerPort: 5432
              name: postgres
            - containerPort: 8008
              name: patroni-api
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: givin-secrets
                  key: POSTGRES_PASSWORD
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: givin-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "4000m"
              memory: "8Gi"
            limits:
              cpu: "8000m"
              memory: "16Gi"
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: postgis-ha-storage
              mountPath: /var/lib/postgresql/data
            - name: config-volume
              mountPath: /etc/patroni
            - name: wal-archive
              mountPath: /var/backups/wal
      volumes:
        - name: config-volume
          configMap:
            name: patroni-config
        - name: wal-archive
          persistentVolumeClaim:
            claimName: givin-wal-archive-pvc
  volumeClaimTemplates:
    - metadata:
        name: postgis-ha-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp3-nvme"
        resources:
          requests:
            storage: 500Gi
