apiVersion: v1
kind: ConfigMap
metadata:
  name: givin-config
  namespace: givin-system
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://givin_admin:$(POSTGRES_PASSWORD)@postgres-postgis:5432/givin_statewide"
  REDIS_URL: "redis://redis-cluster:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092"
  STORAGE_BACKEND: "minio"
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_SECURE: "true"
  MINIO_BUCKET_EVIDENCE: "givin-evidence-vault"
  GIVIN_VISION_MODE: "auto"
  GIVIN_STREAM_MODE: "real"
  CORS_ORIGINS: "https://c4i.police.gujarat.gov.in,https://givin.gujarat.gov.in"
  PROMETHEUS_METRICS_ENABLED: "true"
  OIDC_ENABLED: "true"
  OIDC_ISSUER_URL: "https://sso.gujarat.gov.in/auth/realms/gujarat-police"
  OIDC_CLIENT_ID: "givin-c4i-platform"
---
apiVersion: v1
kind: Secret
metadata:
  name: givin-secrets
  namespace: givin-system
type: Opaque
stringData:
