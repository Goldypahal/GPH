apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: givin-vault-backend
  namespace: givin-system
  labels:
    app.kubernetes.io/name: givin
    app.kubernetes.io/component: secret-management
spec:
  provider:
    vault:
      server: "https://vault.internal.police.gujarat.gov.in:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "givin-system-role"
          serviceAccountRef:
            name: givin-api-sa
