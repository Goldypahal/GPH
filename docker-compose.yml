services:
  givin-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:///./givin.db
      GIVIN_VISION_MODE: simulation
      GIVIN_STREAM_MODE: simulation
      CORS_ORIGINS: http://localhost:8000
    volumes:
      - givin_evidence:/app/data/evidence
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: givinadmin
      MINIO_ROOT_PASSWORD: change-this-development-password
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  givin_evidence:
  minio_data:
